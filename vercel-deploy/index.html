<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complexity Lab</title>
  <meta name="description" content="Interview-ready Python complexity, benchmark, and optimization analysis." />

  <!-- ============================================================= -->
  <!-- STEP 1: paste your live Streamlit app URL between the quotes.  -->
  <!-- (You get this after deploying the app on Streamlit Cloud /     -->
  <!--  Hugging Face — see DEPLOY.md.) Nothing else needs editing.    -->
  <!-- ============================================================= -->
  <script>
    const APP_URL = "https://YOUR-APP-URL-HERE.streamlit.app";
  </script>

  <style>
    :root { --bg:#0b1020; --panel:#111827; --text:#e5e7eb; --muted:#94a3b8; --accent:#22d3ee; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; }
    body {
      background:radial-gradient(1200px 800px at 50% -10%, #16233f 0%, var(--bg) 55%);
      color:var(--text); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px;
    }
    .card {
      width:100%; max-width:520px; text-align:center;
      background:linear-gradient(180deg, rgba(34,211,238,.06), rgba(17,24,39,.6));
      border:1px solid rgba(148,163,184,.15); border-radius:20px; padding:44px 34px;
      box-shadow:0 20px 60px rgba(0,0,0,.45); backdrop-filter:blur(6px);
    }
    h1 { font-size:2rem; margin:0 0 6px; letter-spacing:-.02em; }
    .accent { color:var(--accent); }
    p { color:var(--muted); margin:6px 0 0; line-height:1.5; }
    .spinner {
      width:38px; height:38px; margin:28px auto 20px; border-radius:50%;
      border:3px solid rgba(148,163,184,.25); border-top-color:var(--accent);
      animation:spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    a.btn {
      display:inline-block; margin-top:22px; padding:12px 22px; border-radius:12px;
      background:var(--accent); color:#04222a; font-weight:700; text-decoration:none;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    a.btn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(34,211,238,.35); }
    .small { font-size:.85rem; margin-top:18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Complexity <span class="accent">Lab</span></h1>
    <p>Interview-ready Python complexity, benchmark &amp; optimization analysis.</p>
    <div class="spinner" id="spin"></div>
    <p id="status">Opening the live app…</p>
    <a class="btn" id="go" href="#">Enter Complexity Lab →</a>
    <p class="small">If the page doesn't move automatically, click the button above.</p>
  </div>

  <script>
    (function () {
      const status = document.getElementById("status");
      const go = document.getElementById("go");
      const spin = document.getElementById("spin");
      const configured = APP_URL && !APP_URL.includes("YOUR-APP-URL-HERE");

      if (!configured) {
        spin.style.display = "none";
        status.textContent = "Set APP_URL in index.html to your deployed Streamlit URL.";
        go.style.display = "none";
        return;
      }
      go.href = APP_URL;
      // Give the branded frame a beat, then forward.
      setTimeout(function () { window.location.replace(APP_URL); }, 1200);
    })();
  </script>
</body>
</html>
